<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  height: 100vh;
  background: linear-gradient(135deg, #833ab4, #fd1d1d, #fcb045);
}
.modal {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.6);
  display: flex;
  align-items: center;
  justify-content: center;
}
.login-box {
  background: #fff;
  width: 330px;
  padding: 25px;
  border-radius: 10px;
  text-align: center;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
input {
  width: 100%;
  padding: 10px;
  margin-top: 10px;
  border-radius: 5px;
  border: 1px solid #dbdbdb;
}
button {
  width: 100%;
  padding: 10px;
  margin-top: 12px;
  border: none;
  border-radius: 5px;
  cursor: pointer;
}
.email-btn { background: #0095f6; color:#fff; }
.google-btn { background:#fff; border:1px solid #ddd; }
.forgot-btn { background:#fbbf24; }
.divider { margin:12px 0; color:#777; font-size:12px; }
</style>
</head>

<body>

<div class="modal">
  <div class="login-box">
    <h3>Login</h3>

    <input type="email" id="email" placeholder="Email">
    <input type="password" id="password" placeholder="Password">

    <button class="email-btn" id="emailLogin">Login with Email</button>
    <button class="forgot-btn" id="forgotBtn">Forgot Password</button>

    <div class="divider">OR</div>

    <button class="google-btn" id="googleLogin">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18">
      Continue with Google
    </button>
  </div>
</div>

<!-- Firebase -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  sendPasswordResetEmail,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCl0k3tOjj27o3cQNumqBJprsjYKIn97ck",
  authDomain: "my-login-app-e9289.firebaseapp.com",
  projectId: "my-login-app-e9289",
  storageBucket: "my-login-app-e9289.firebasestorage.app",
  messagingSenderId: "29241892380",
  appId: "1:29241892380:web:b856e2811ce690a6d009d9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();

const ADMIN_EMAIL = "thakurat886@gmail.com";

/* 🔐 AUTO REDIRECT IF ALREADY LOGGED IN */



/* GOOGLE LOGIN */
document.getElementById("googleLogin").onclick = async () => {
  try {
    const result = await signInWithPopup(auth, provider);
    const user = result.user;

    if (user.email === ADMIN_EMAIL) {
      window.location.href = "admin.html";
    } else {
      window.location.href = "profile.html";
    }

  } catch (err) {
    alert(err.message);
  }
};

/* EMAIL LOGIN / SIGNUP */
document.getElementById("emailLogin").onclick = () => {
  const email = emailInput.value;
  const password = passwordInput.value;

  if(!email || !password){
    alert("Enter email and password");
    return;
  }

  signInWithEmailAndPassword(auth, email, password)
  .catch(()=>{
    createUserWithEmailAndPassword(auth, email, password)
    .catch(err=>alert(err.message));
  });
};

/* FORGOT PASSWORD */
document.getElementById("forgotBtn").onclick = () => {
  const email = emailInput.value;
  if(!email){
    alert("Enter your email first");
    return;
  }
  sendPasswordResetEmail(auth, email)
    .then(()=>alert("Reset email sent"))
    .catch(err=>alert(err.message));
};

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
</script>

</body>
</html>
