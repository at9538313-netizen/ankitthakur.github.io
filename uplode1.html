

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Course</title>

    <style>
        /* Page background */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Title */
        .form-title {
            text-align: center;
            margin-top: 30px;
            color: white;
            font-size: 2em;
        }

        /* Form card */
        .upload-form {
            max-width: 420px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
        }

        /* Labels */
        .upload-form label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
            color: #333;
        }

        /* Inputs & select */
        .upload-form input,
        .upload-form select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 1em;
            transition: 0.3s;
        }

        .upload-form input:focus,
        .upload-form select:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 6px rgba(102,126,234,0.5);
        }

        /* Error message */
        .error-msg {
            display: none;
            color: #e11d48;
            font-size: 0.9em;
            margin-top: 5px;
        }

        /* Submit button */
        .upload-form button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            font-size: 1.1em;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
        }

        .upload-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        /* Success message */
        .success-msg {
            display: none;
            text-align: center;
            margin-top: 40px;
            color: #22c55e;
            font-size: 1.2em;
            font-weight: bold;
        }

        /* Back button */
        .back-home {
            display: block;
            width: fit-content;
            margin: 30px auto;
            padding: 10px 18px;
            background: white;
            color: #764ba2;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<h2 class="form-title">📤 Course Upload Form</h2>

<form class="upload-form" id="uploadForm" onsubmit="handleSubmit(event)">

    <label>Full Name</label>
    <input type="text" placeholder="Enter your full name" required>

    <label>Email</label>
    <input type="email" placeholder="Enter your email" required>

    <label>Contact Number</label>
    <input
        type="tel"
        inputmode="numeric"
        id="contact"
        placeholder="Enter 10-digit contact number"
        maxlength="10"
        required
    >
    <small id="errorMsg" class="error-msg">
        ❌ Contact number must be exactly 10 digits
    </small>

    <label>You are a:</label>
    <select required>
        <option value="">-- Select Role --</option>
        <option>Teacher</option>
        <option>Student</option>
        <option>Entrepreneur</option>
    </select>

    <button type="submit">Submit</button>
</form><p id="successMsg" class="success-msg">✅ Submitted successfully</p>
    <a href="index.html" class="back-home">⬅ Back to Home</a>

    

<script>
function handleSubmit(event) {
    event.preventDefault(); // stop page reload

    const contact = document.getElementById("contact").value;
    const error = document.getElementById("errorMsg");
    const success = document.getElementById("successMsg");
    const form = document.getElementById("uploadForm");

    const pattern = /^[0-9]{10}$/;

    if (!pattern.test(contact)) {
        error.style.display = "block";
        success.style.display = "none";
        return;
    }

    error.style.display = "none";
    form.style.display = "none";
    success.style.display = "block";
}
</script>

</body>
</html>
