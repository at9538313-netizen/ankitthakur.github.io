

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>User Profile</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;color:white;}
.header{background:#0f172a;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:1.5em;font-weight:bold;}
.profile-container{max-width:480px;margin:40px auto;background:white;border-radius:15px;padding:25px;text-align:center;color:black;}
.profile-pic{width:110px;height:110px;border-radius:50%;border:3px solid #667eea;object-fit:cover;}
.dashboard{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
.card{background:#f5f7ff;padding:15px;border-radius:12px;}
.card strong{display:block;font-size:18px;color:#667eea;}
.edit-section{margin-top:25px;text-align:left;}
input,select{width:100%;padding:8px;margin-top:5px;}
.btn{margin-top:15px;padding:10px;width:100%;background:#667eea;color:white;border:none;border-radius:20px;cursor:pointer;}
.logout{background:#ef4444;}
.error{color:red;font-size:13px;}
.success{display:none;margin-top:15px;padding:12px;background:#e6fffa;color:#065f46;border-radius:10px;font-weight:bold;text-align:center;}
</style>
</head>

<body>

<header class="header">
  <div class="logo">MyCourses</div>
  <div>
    <a href="index.html" style="color:white;">Home</a>
    <a href="course.html" style="color:white;">Courses</a>
    <a href="admin.html" id="adminLink" style="display:none;color:white;">Admin Panel</a>
  </div>
</header>

<div class="profile-container">
  <img id="profilePic" class="profile-pic" src="profile.png">
  <h2 id="showName">Loading...</h2>
  <p id="showEmail"></p>

  <div class="dashboard">
    <div class="card"><strong id="dashRole">-</strong>Role</div>
    <div class="card"><strong id="dashContact">-</strong>Contact</div>
    <div class="card"><strong id="dashStatus">❌</strong>Status</div>
    <div class="card"><strong>Active</strong>Account</div>
  </div>

  <div class="edit-section">
    <h3>Edit Profile</h3>

    <label>Name</label>
    <input id="nameInput">

    <label>Email</label>
    <input id="emailInput" disabled>

    <label>Contact (10 digits)</label>
    <input id="contactInput" maxlength="10">
    <div class="error" id="errorMsg"></div>

    <label>Role</label>
    <select id="roleInput">
      <option>Student</option>
      <option>Teacher</option>
      <option>Entrepreneur</option>
    </select>

    <button class="btn" onclick="saveProfile()">Save Profile</button>
    <button class="btn logout" onclick="logout()">Logout</button>

    <div class="success" id="successMsg">🎉 Profile saved successfully!</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCl0k3tOjj27o3cQNumqBJprsjYKIn97ck",
  authDomain: "my-login-app-e9289.firebaseapp.com",
  projectId: "my-login-app-e9289",
  storageBucket: "my-login-app-e9289.firebasestorage.app",
  messagingSenderId: "29241892380",
  appId: "1:29241892380:web:b856e2811ce690a6d009d9"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

const ADMIN_EMAIL = "thakurat886@gmail.com";
let currentUser = null;

/* 🔗 Get all elements */
const showName = document.getElementById("showName");
const showEmail = document.getElementById("showEmail");
const nameInput = document.getElementById("nameInput");
const emailInput = document.getElementById("emailInput");
const contactInput = document.getElementById("contactInput");
const roleInput = document.getElementById("roleInput");
const errorMsg = document.getElementById("errorMsg");
const successMsg = document.getElementById("successMsg");
const dashRole = document.getElementById("dashRole");
const dashContact = document.getElementById("dashContact");
const dashStatus = document.getElementById("dashStatus");
const profilePic = document.getElementById("profilePic");
const adminLink = document.getElementById("adminLink");

/* 🔐 Login check */
onAuthStateChanged(auth, user => {
  if(!user){
    window.location.href="login.html";
    return;
  }

  currentUser = user;
  showEmail.textContent = user.email;
  emailInput.value = user.email;
  showName.textContent = user.displayName || "User";

  if(user.photoURL) profilePic.src = user.photoURL;
  if(user.email === ADMIN_EMAIL) adminLink.style.display="inline";

  const saved = localStorage.getItem("profile_"+user.uid);
  if(saved){
    const p = JSON.parse(saved);
    nameInput.value = p.name;
    contactInput.value = p.contact;
    roleInput.value = p.role;
    showName.textContent = p.name;
    updateDashboard(p);
  }
});

/* 💾 Save profile */
window.saveProfile = () => {
  errorMsg.textContent="";
  const phone = contactInput.value.trim();

  if(!/^[0-9]{10}$/.test(phone)){
    errorMsg.textContent="Contact must be exactly 10 digits";
    return;
  }

  const data = {
    name: nameInput.value,
    contact: phone,
    role: roleInput.value
  };

  localStorage.setItem("profile_"+currentUser.uid, JSON.stringify(data));
  showName.textContent = data.name;
  updateDashboard(data);

  successMsg.style.display="block";
  setTimeout(()=>successMsg.style.display="none",3000);
};

function updateDashboard(d){
  dashRole.textContent = d.role;
  dashContact.textContent = d.contact;
  dashStatus.textContent = "✅";
}

/* 🚪 Logout */
window.logout = () => {
  signOut(auth).then(()=>window.location.href="login.html");
};
</script>

</body>
</html>
