


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel</title>
<style>
body{margin:0;font-family:Arial;background:linear-gradient(135deg,#0f172a,#1e293b);color:white;min-height:100vh;}
.header{background:#020617;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;}
.logo{font-size:1.5em;font-weight:bold;}
.container{max-width:600px;margin:40px auto;background:#020617;padding:25px;border-radius:15px;box-shadow:0 15px 30px rgba(0,0,0,0.5);}
.card{background:#0f172a;padding:20px;border-radius:12px;margin-top:15px;text-align:center;}
.card strong{display:block;font-size:22px;color:#38bdf8;}
.btn{margin-top:20px;padding:12px;width:100%;background:#ef4444;color:white;border:none;border-radius:25px;cursor:pointer;}
</style>
</head>
<body>
<header class="header"><div class="logo">Admin Panel</div></header>
<div class="container">
<h2>Welcome Admin</h2>
<p id="adminEmail"></p>
<div class="card"><strong id="userCount">0</strong>Total Users</div>
<button class="btn" onclick="logout()">Logout</button>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
  apiKey:"AIzaSyCl0k3tOjj27o3cQNumqBJprsjYKIn97ck",
  authDomain:"my-login-app-e9289.firebaseapp.com",
  projectId:"my-login-app-e9289",
  storageBucket:"my-login-app-e9289.firebasestorage.app",
  messagingSenderId:"29241892380",
  appId:"1:29241892380:web:b856e2811ce690a6d009d9"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);

const ADMIN_EMAIL="thakurat886@gmail.com";

onAuthStateChanged(auth,(user)=>{
  if(!user || user.email!==ADMIN_EMAIL) window.location.href="index.html";
  adminEmail.textContent="Logged in as: "+user.email;
  let count=0;
  for(let key in localStorage){ if(key.startsWith("profile_")) count++; }
  userCount.textContent=count;
});

window.logout=function(){ signOut(auth).then(()=>window.location.href="login.html"); };
</script>
</body>
</html>
