

<!DOCTYPE html>
<html>
<head>
<title>Admin Panel</title>
<style>
body{font-family:Arial;background:#f1f5f9;padding:20px;}
h1{text-align:center;}
table{width:100%;border-collapse:collapse;background:white;}
th,td{padding:12px;border:1px solid #ddd;text-align:center;}
th{background:#0f172a;color:white;}
.logout{margin:15px;padding:10px;background:#ef4444;color:white;border:none;cursor:pointer;}
</style>
</head>
<body>

<h1>Admin Control Panel</h1>
<button class="logout" onclick="logout()">Logout</button>

<table>
<thead>
<tr>
<th>Name</th>
<th>Email</th>
<th>Contact</th>
<th>Role</th>
<th>Purchased Courses</th>
</tr>
</thead>
<tbody id="userTable"></tbody>
</table>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

const firebaseConfig = {
 apiKey:"AIzaSyCl0k3tOjj27o3cQNumqBJprsjYKIn97ck",
 authDomain:"my-login-app-e9289.firebaseapp.com",
 projectId:"my-login-app-e9289"
};

const app=initializeApp(firebaseConfig);
const auth=getAuth(app);
const ADMIN_EMAIL="thakurat886@gmail.com";

onAuthStateChanged(auth,user=>{
 if(!user || user.email!==ADMIN_EMAIL){
   window.location.href="login.html";
   return;
 }

 loadUsers();
});

function loadUsers(){
 const table=document.getElementById("userTable");
 table.innerHTML="";

 for(let key in localStorage){
   if(key.startsWith("profile_")){
     const uid=key.replace("profile_","");
     const profile=JSON.parse(localStorage.getItem(key));
     const purchase=JSON.parse(localStorage.getItem("purchase_"+uid) || "[]");

     const tr=document.createElement("tr");
     tr.innerHTML=`
      <td>${profile.name||"-"}</td>
      <td>${profile.email||"-"}</td>
      <td>${profile.contact||"-"}</td>
      <td>${profile.role||"-"}</td>
      <td>${purchase.join(", ") || "None"}</td>
     `;
     table.appendChild(tr);
   }
 }
}

window.logout=()=>signOut(auth).then(()=>location.href="login.html");
</script>

</body>
</html>
